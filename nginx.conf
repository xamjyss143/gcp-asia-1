worker_processes auto;

events {}

http {
    # --------------------
    # Common proxy headers (Cloud Run safe)
    # --------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 8080;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location /ph001 {
            proxy_pass http://8.212.177.181:700;
        }

        location /sg001 {
            proxy_pass http://84.247.148.54:700;
        }

        location /sg002 {
            proxy_pass http://147.93.158.152:700;
        }

        location /sg003 {
            proxy_pass http://194.233.83.37:700;
        }

        location /sg004 {
            proxy_pass http://147.93.158.151:700;
        }

        # --------------------
        # PH001
        # --------------------
        location /vless_ph001 {
            proxy_pass http://8.212.177.181/vless_;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /vmess_ph001 {
            proxy_pass http://8.212.177.181/vmess_;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /trojan-ws_ph001 {
            proxy_pass http://8.212.177.181/trojan-ws_;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # --------------------
        # SG001
        # --------------------
